[defaults]
inventory = inventories/inventory.ini,inventories/hosts.ini
remote_user = ansible_mgr
private_key_file = ~/.ssh/id_ansible
host_key_checking = False
vault_editor = nano
vault_password_file = ~/.ansible/vault-password

[inventory]
enable_plugins = community.proxmox.proxmox, host_list, script, auto, yaml, ini, toml

; [privilege_escalation]
; become = True
; become_method = su
; become_user = root
; become_ask_pass = False