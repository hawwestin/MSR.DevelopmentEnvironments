---
- name: Verify guest agent platform support
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts['os_family'] == 'Debian' and
         ansible_facts['service_mgr'] == 'systemd') or
        ansible_facts['system'] == 'FreeBSD'
    fail_msg: QEMU guest agent installation requires Debian with systemd or pfSense on FreeBSD.

- name: Update apt cache and install QEMU guest agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Enable and start QEMU guest agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
    state: started
  when: ansible_facts['os_family'] == 'Debian'

- name: Install QEMU guest agent on pfSense
  ansible.builtin.include_tasks: pfsense.yml
  when: ansible_facts['system'] == 'FreeBSD'

# Add here any additional tasks for other supported platforms in the future.