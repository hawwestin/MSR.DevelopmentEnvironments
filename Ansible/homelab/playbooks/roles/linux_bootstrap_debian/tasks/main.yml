---
- name: Prepare minimal Debian guests through su without requiring Python
  ansible.builtin.raw: |
    set -eu
    export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    test "$(id -u)" = 0
    . /etc/os-release
    case "$ID" in
      debian|ubuntu) ;;
      *) echo 'The minimal su preparation supports Debian/Ubuntu only.' >&2; exit 1 ;;
    esac
    missing_packages=''
    for package in sudo python3 python3-apt; do
      if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
        missing_packages="$missing_packages $package"
      fi
    done
    if [ -n "$missing_packages" ]; then
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y $missing_packages
      echo ANSIBLE_BOOTSTRAP_PACKAGES_INSTALLED
    fi
  register: minimal_debian_preparation
  changed_when: "'ANSIBLE_BOOTSTRAP_PACKAGES_INSTALLED' in minimal_debian_preparation.stdout"
