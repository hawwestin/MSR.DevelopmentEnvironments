---
- name: Require approved operator public keys
  ansible.builtin.assert:
    that:
      - public_bootstrap_authorized_keys is sequence
      - public_bootstrap_authorized_keys is not string
      - public_bootstrap_authorized_keys is not mapping
      - public_bootstrap_authorized_keys | length > 0
    fail_msg: Configure public_bootstrap_authorized_keys with approved SSH public keys before bootstrap.
  tags: [bootstrap_preflight]

- name: Require individual public key strings
  ansible.builtin.assert:
    that:
      - operator_key is string
      - operator_key is match('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh.com|sk-ecdsa-sha2-nistp256@openssh.com) [A-Za-z0-9+/]+={0,2}( [^\r\n]*)?$')
    fail_msg: Each approved entry must contain exactly one OpenSSH public key, never a private key.
  loop: "{{ public_bootstrap_authorized_keys }}"
  loop_control:
    loop_var: operator_key
    label: approved operator key
  no_log: true
  tags: [bootstrap_preflight]

- name: Validate public keys with the controller SSH tools
  ansible.builtin.command:
    argv: [ssh-keygen, -l, -f, /dev/stdin]
    stdin: "{{ operator_key }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  loop: "{{ public_bootstrap_authorized_keys }}"
  loop_control:
    loop_var: operator_key
    label: approved operator key
  changed_when: false
  check_mode: false
  no_log: true
  tags: [bootstrap_preflight]

# TODO extract this to a separate role for reusability and testing
- name: Prepare minimal Debian guests through su without requiring Python
  ansible.builtin.raw: |
    set -eu
    export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    test "$(id -u)" = 0
    . /etc/os-release
    case "$ID" in
      debian|ubuntu) ;;
      *) echo 'The minimal su preparation supports Debian/Ubuntu only.' >&2; exit 1 ;;
    esac
    missing_packages=''
    for package in sudo python3 python3-apt; do
      if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
        missing_packages="$missing_packages $package"
      fi
    done
    if [ -n "$missing_packages" ]; then
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y $missing_packages
      echo ANSIBLE_BOOTSTRAP_PACKAGES_INSTALLED
    fi
  register: minimal_debian_preparation
  changed_when: "'ANSIBLE_BOOTSTRAP_PACKAGES_INSTALLED' in minimal_debian_preparation.stdout"
  when: linux_bootstrap_prepare_debian | default(false)

- name: Verify the initial bootstrap user can escalate before account changes
  when: linux_bootstrap_verify_sudo
  block:
    - name: Check initial root privileges using the selected escalation method
      ansible.builtin.command:
        argv: [id, -u]
      vars:
        ansible_become: true
      register: initial_sudo
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require initial root privileges
      ansible.builtin.assert:
        that:
          - initial_sudo.stdout == '0'
        fail_msg: The initial bootstrap user must have working access to root using the selected escalation method.
      no_log: true

- name: Gather operating system facts without privilege escalation
  ansible.builtin.setup:
    gather_subset: [min]
  vars:
    ansible_become: false

- name: Require a supported Linux distribution
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in ['Debian', 'RedHat']
      - ansible_facts.os_family != 'RedHat' or ansible_facts.distribution_major_version | int >= 8
    fail_msg: This role supports Debian/Ubuntu and modern dnf-based Red Hat family hosts (version 8+).

- name: Install sudo on Debian family hosts
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == 'Debian'

- name: Install sudo on Red Hat family hosts
  ansible.builtin.dnf:
    name: sudo
    state: present
  when: ansible_facts.os_family == 'RedHat'

- name: Configure each automation user
  ansible.builtin.include_tasks: user.yml
  loop: "{{ linux_bootstrap_users }}"
  loop_control:
    loop_var: bootstrap_user
    label: "{{ bootstrap_user.name }}"

- name: Ensure sudo policy directory exists
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Install validated automation sudo policy
  ansible.builtin.template:
    src: sudoers.j2
    dest: "/etc/sudoers.d/{{ bootstrap_user.name }}"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ linux_bootstrap_users }}"
  when: >-
    (bootstrap_user.sudo | default(false) | bool) or
    (bootstrap_user.sudo_commands | default([]) | length > 0)
  loop_control:
    loop_var: bootstrap_user
    label: "{{ bootstrap_user.name }}"