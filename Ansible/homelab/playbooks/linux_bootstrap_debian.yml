---
- name: Bootstrap the automation account using root SSH on lxc hosts
  hosts: lxc
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    ansible_user: root
    # TODO we should use ssh-key based authentication for root, but for now we will use the default_ansible_become_pass from the vault file.
    ansible_password: "{{ default_ansible_become_pass | default('') }}"
    ansible_ssh_private_key_file: ~/.ssh/id_rsa_windows
    ansible_become: false
    ansible_host_key_checking: true
    ansible_ssh_args: >-
      -o ControlMaster=no -o ControlPath=none -o StrictHostKeyChecking=yes
      -o PreferredAuthentications=password,keyboard-interactive
      -o PubkeyAuthentication=no
  roles:
    - linux_bootstrap_debian

