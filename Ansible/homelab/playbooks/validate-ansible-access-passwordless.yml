---
# This playbook is used to validate that the ansible_mgr user can log in to the target 
# hosts and escalate privileges to root without a password prompt.
- name: Verify key-based automation access and passwordless sudo
  hosts: "{{ automation_validation_hosts | default('new') }}"
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    # this need a refactor as different host have different users and passwords, but for now we will just use a single user with sudo privileges
    # TODO this may be different for your environment, but should be a non-root user with sudo privileges
    ansible_user: "{{ automation_expected_user }}"
    ansible_password: ''
    ansible_become: false
    ansible_become_password: ''
    # host_keys are already known and trusted, via enroll-host-keys.py
    ansible_host_key_checking: true
    ansible_ssh_args: >-
      -o ControlMaster=no -o ControlPath=none -o StrictHostKeyChecking=yes
      -o PreferredAuthentications=publickey -o PasswordAuthentication=no
      -o KbdInteractiveAuthentication=no -o BatchMode=yes
  tasks:
    - name: Validate access only when changes have been applied
      when: not ansible_check_mode
      block:
        - name: Close any cached SSH connection
          ansible.builtin.meta: reset_connection

        - name: Check the SSH login identity without privilege escalation
          ansible.builtin.command:
            argv: [id, -un]
          register: automation_login
          changed_when: false

        - name: Require the automation SSH identity
          ansible.builtin.assert:
            that:
              - automation_login.stdout == '{{ automation_expected_user }}'

        - name: Check passwordless root escalation
          ansible.builtin.command:
            argv: [id, -u]
          vars:
            ansible_become: true
            ansible_become_user: root 
            ansible_become_method: sudo
            ansible_become_flags: '-H -n'
          register: automation_root
          changed_when: false

        - name: Require root privileges after sudo
          ansible.builtin.assert:
            that:
              - automation_root.stdout == '0'