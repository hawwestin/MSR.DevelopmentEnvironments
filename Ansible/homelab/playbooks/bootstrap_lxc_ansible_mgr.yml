---
# ansible-playbook Ansible/homelab/playbooks/bootstrap_lxc_ansible_mgr.yml --limit "opti3050"
- name: Bootstrap new LXC container
  hosts: proxmox # proxmox host, not the container. Limit to the proxmox host that will host the new LXC container.
  gather_facts: false
  roles:
    - role: lxc_bootstrap
      vars:
        lxc_vmid: "{{ automation_lxcid | default('104') }}" # Edit for your new LXC container ID
        lxc_ansible_pub_key: "{{ lookup('file', '~/.ssh/id_ansible.pub') }}"