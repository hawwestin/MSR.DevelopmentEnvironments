---
# Encrypted with: ansible-vault encrypt inventories/group_vars/new/vault.yml
# Edit  with: ansible-vault edit inventories/group_vars/new/vault.yml
# Set ANSIBLE_VAULT_PASSWORD_FILE or use --vault-password-file to provide password

# TODO rename it later to vault_root_password
ansible_become_password: "{{ vault_ansible_mgr_password }}"
ansible_password: "{{ vault_ansible_mgr_password }}"
ansible_ssh_authentication_method: password


public_bootstrap_authorized_keys:
  - "{{ lookup('file', '~/.ssh/id_ansible.pub') }}"

  
ansible_mgr_keys:
  - "{{ lookup('file', '~/.ssh/id_ansible.pub') }}" #TODO change me later
ansible_nut_keys:
  - "{{ lookup('file', '~/.ssh/id_ansible.pub') }}" #TODO change me later
