# Default Ansible access variables for all hosts. These can be overridden in host_vars or group_vars for specific hosts or groups.
default_ansible_become_pass: "{{ vault_default_become_pass }}"
# ansible_user: ansible_mgr
ansible_ssh_private_key_file: ~/.ssh/id_ansible

vm_bootstrap_credentials_user: root
vm_bootstrap_credentials_become_method: sudo

# Reference Variables to vault variables
nut_monitor_password: "{{ vault_nut_monitor_password }}"
nut_admin_password: "{{ vault_nut_admin_password }}"
nut_qnap_admin_password: "{{ vault_nut_qnap_admin_password }}"
nut_ups_serial: "{{ vault_nut_ups_serial }}" # todo add to vault


ansible_mgr_keys:
  - "{{ lookup('file', '~/.ssh/id_ansible.pub') }}"
ansible_nut_keys:
  - "{{ lookup('file', '~/.ssh/id_ansible_nut.pub') }}"
