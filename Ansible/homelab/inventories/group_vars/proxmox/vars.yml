# TODO for Proxmox we may want to use different keys for the ansible_mgr and ansible_nut users. 
# such passphrase protected keys can be used for the ansible_nut user.
# For now we will use the same keys for both users.
ansible_mgr_keys:
  - "{{ lookup('file', '~/.ssh/id_ansible.pub') }}" 
ansible_nut_keys:
  - "{{ lookup('file', '~/.ssh/id_ansible_nut.pub') }}" 
