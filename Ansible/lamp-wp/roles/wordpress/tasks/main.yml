---
- name: Remove default index.html
  file:
    path: /var/www/html/index.html
    state: absent

- name: Extract WordPress
  unarchive:
    src: wordpress-6.9.4.tar.gz
    dest: /var/www/html
    remote_src: yes
    extra_opts: [ "--strip-components=1" ]

- name: Set permissions
  file:
    path: /var/www/html
    owner: www-data
    group: www-data
    recurse: yes
