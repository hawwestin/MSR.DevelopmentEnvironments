---
- name: Check whether WP-CLI is installed
  stat:
    path: /usr/local/bin/wp
  register: wp_cli_stat

- name: Download and install WP-CLI
  get_url:
    url: https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
    dest: /usr/local/bin/wp
    mode: '0755'
  when: not wp_cli_stat.stat.exists

- name: Update WordPress core
  command: wp core update
  args:
    chdir: "{{ web_root }}"
  become_user: www-data
  register: wp_core_update
  changed_when: "'updated successfully' in wp_core_update.stdout | lower"

- name: Update the WordPress database
  command: wp core update-db
  args:
    chdir: "{{ web_root }}"
  become_user: www-data
  register: wp_db_update
  changed_when: "'upgraded' in wp_db_update.stdout | lower"

- name: Update all WordPress plugins
  command: wp plugin update --all --exclude=contact-form-7
  args:
    chdir: "{{ web_root }}"
  become_user: www-data
  register: wp_plugins_update
  changed_when: wp_plugins_update.stdout is search('(?i)updated [1-9][0-9]* of')
  # changed_when: "'Success: Updated' in wp_plugins_update.stdout"
  failed_when: >
    wp_plugins_update.rc != 0 and 
    'Error: No plugins updated' not in wp_plugins_update.stderr

- name: Update all WordPress themes
  command: wp theme update --all
  args:
    chdir: "{{ web_root }}"
  become_user: www-data
  register: wp_themes_update
  changed_when: wp_themes_update.stdout is search('(?i)updated [1-9][0-9]* of')