services:
  portainer:
    image: portainer/agent:latest
    container_name: portainer_agent
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - 9001:9001
    restart: always
    networks:
      qnet-static:
        ipv4_address: 192.168.20.90
networks:
  qnet-static:
    name: docker-static-bond0.20
    external: true