  # Twój lokalny model z limitami VRAM z Ollamy
  - model_name: local-qwen-2gb
    litellm_params:
      model: ollama/qwen-2gb-dev
      api_base: "http://ollama:11434"
      # api_base: "http://host.docker.internal:11434" # for docker run 

  - model_name: local-qwen2.5-0.5b
    litellm_params:
      model: ollama/qwen2.5:0.5b
      api_base: "http://ollama:11434"

  - model_name: local-qwen2.5-1.5b
    litellm_params:
      model: ollama/qwen2.5:1.5b
      api_base: "http://ollama:11434"

  - model_name: local-llama3.2-1b
    litellm_params:
      model: ollama/llama3.2:1b
      api_base: "http://ollama:11434"

