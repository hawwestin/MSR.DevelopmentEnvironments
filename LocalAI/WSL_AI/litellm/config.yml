model_list:
  # Models for RTX 3060 12GB
  # VRAM = Parameters Count * ~0,65GB + Context ~1,5GB
  # VRAM ~6,0GB
  - model_name: local-qwen2.5-coder-7b
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: "http://ollama:11434"

  # VRAM ~6,7GB
  - model_name: local-llama3.1-8b
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: "http://ollama:11434"

  # VRAM ~7,3GB 
  - model_name: local-gemma2-9b
    litellm_params:
      model: ollama/gemma2:9b
      api_base: "http://ollama:11434"

  # VRAM ~3,5GB
  - model_name: local-llama3.2-3b
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: "http://ollama:11434"


  # Local small models with VRAM limit
  - model_name: local-qwen-2gb
    litellm_params:
      model: ollama/qwen-2gb-dev
      api_base: "http://ollama:11434"
    # api_base: "http://host.docker.internal:11434" # for docker run 

  - model_name: local-qwen2.5-1.5b
    litellm_params:
      model: ollama/qwen2.5:1.5b
      api_base: "http://ollama:11434"

  - model_name: local-llama3.2-1b
    litellm_params:
      model: ollama/llama3.2:1b
      api_base: "http://ollama:11434"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # After setting this to true, the API will not allow login with username/password, only with the master key. This is recommended for production deployments.
  disable_env_credential_login: true