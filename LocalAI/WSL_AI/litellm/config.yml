model_list:
  # Model chmurowy (Google Gemini)
  - model_name: gemini-1.5-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: "os.environ/GEMINI_API_KEY"

  # Twój lokalny model z limitami VRAM z Ollamy
  - model_name: local-qwen-2gb
    litellm_params:
      model: ollama/qwen-2gb-dev
      api_base: "http://ollama:11434"
      # api_base: "http://host.docker.internal:11434" # for docker run 

# Ustawienia routera (opcjonalne, przydatne do testów fallback)
router_settings:
  fallback_models:
    - gemini-1.5-flash: ["local-qwen-2gb"]