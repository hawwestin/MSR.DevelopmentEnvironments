---
name: homeassistant
services:
  homeassistant:
    container_name: homeassistant
    networks:
      # Add the container to the IOT network
      - homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.6
    depends_on:
      - mqtt
      - zigbee2mqtt
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Use the Home Assistant configuration directory on /mnt/docker-data/home-assistant/config on the host to persist the Home Assistant configuration and data
      - /mnt/docker-data/home-assistant/config:/config
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    restart: unless-stopped
    ports:
      - 80:8123
  mqtt:
    container_name: mqtt
    networks:
      - homeassistant
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Use the MQTT data directory on /mnt/docker-data/mqtt/data on the host to persist the MQTT configuration and data
      - /mnt/docker-data/mqtt:/mosquitto
    # ports:
      #- 1883:1883
      #- 9001:9001
    command: mosquitto -c /mosquitto-no-auth.conf

  zigbee2mqtt:
    container_name: zigbee2mqtt
    networks:
      # Add the container to the IOT network
      - homeassistant
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    restart: unless-stopped
    image: ghcr.io/koenkk/zigbee2mqtt:latest
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Use the Zigbee2MQTT data directory on /mnt/docker-data/zigbee2mqtt/data on the host to persist the Zigbee2MQTT configuration and data
      - /mnt/docker-data/zigbee2mqtt/data:/app/data
    ports:
      - 8080:8080
    group_add:
      - dialout
    user: 1000:1000
    devices:
      # Pass the Zigbee adapter through to the container using the --device flag
      - /dev/ttyUSB-Zigbee:/dev/ttyUSB-Zigbee

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    user: 1000:1000
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    networks:
      - homeassistant
    volumes:
      - /mnt/docker-data/matter:/data

  otbr:
    image: openthread/border-router:latest
    container_name: otbr
    restart: unless-stopped
    networks:
      - homeassistant
    environment:
      # Disable start scritps that requires iptables annd modify routing tables. This is required for running in a unprivileged container.
      - NAT64=0 
      - NAT44=0
      - DNS64=0
      - FIREWALL=0
      - OT_RCP_DEVICE=spinel+hdlc+uart:///dev/ttyUSB-Thread?uart-baudrate=460800
      - OT_INFRA_IF=eth0
      - OT_THREAD_IF=wpan0
    # privileged: true # Required for radio and IPv6
    # sysctls:
    #   - net.ipv6.conf.all.disable_ipv6=0
    #   - net.ipv4.conf.all.forwarding=1
    #   - net.ipv6.conf.all.forwarding=1
    devices:
      - /dev/ttyUSB-Thread:/dev/ttyUSB-Thread
      - /dev/net/tun:/dev/net/tun # <-- Add module of virtual interfaces
    cap_add:
      - NET_ADMIN # <-- Change: Permission to create wpan0 interface
    ports:
      - 8081:80
    group_add:
      - 20 # dialout group
    volumes:
      - /mnt/docker-data/otbr:/data

networks:
  homeassistant:
    name: homeassistant